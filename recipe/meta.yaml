{% set version = "6.4.4" %}

package:
  name: jupyter_console
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/j/jupyter_console/jupyter_console-{{ version }}.tar.gz
  sha256: 172f5335e31d600df61613a97b7f0352f2c8250bbd1092ef2d658f77249f89fb

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  entry_points:
    - jupyter-console = jupyter_console.app:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - jupyter_client >=7.0.0
    - ipython
    - ipykernel
    - prompt_toolkit >=2.0.0,<3.1.0,!=3.0.0,!=3.0.1
    - pygments

test:
  imports:
    - jupyter_console
  requires:
    - pip
  commands:
    - pip check
    - jupyter-console -h

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter terminal console
  description: |
    Jupyter console is a terminal frontend for kernels using the Jupyter protocol.
  doc_url: https://jupyter-console.readthedocs.io/
  doc_source_url: https://github.com/jupyter/jupyter_console/blob/master/docs/index.rst
  dev_url: https://github.com/jupyter/jupyter_console

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - blink1073
    - Carreau
