{% set version = "6.6.3" %}

package:
  name: jupyter_console
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/j/jupyter_console/jupyter_console-{{ version }}.tar.gz
  sha256: 566a4bf31c87adbfadf22cdf846e3069b59a71ed5da71d6ba4d8aaad14a53539

build:
  number: 1
  # Upstream supports python 3.7 but to build for python 3.7, jupyter_console requires jupyter_core v 4.12 exactly, which we don't have in the channel. Hence 
  # restricting to py<38.
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vvv
  entry_points:
    - jupyter-console = jupyter_console.app:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - hatchling 1.18
  run:
    - python
    - jupyter_client >=7.0.0
    - ipython
    - ipykernel >=6.14
    - prompt_toolkit >=3.0.30
    - pygments
    - jupyter_core >=4.12,!=5.0.*
    - pyzmq >=17
    - traitlets >=5.4

test:
  imports:
    - jupyter_console
  requires:
    - pip
  commands:
    - pip check
    - jupyter-console -h
    - jupyter kernelspec list

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter terminal console
  description: |
    Jupyter console is a terminal frontend for kernels using the Jupyter protocol.
  doc_url: https://jupyter-console.readthedocs.io/
  dev_url: https://github.com/jupyter/jupyter_console

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - blink1073
    - Carreau
