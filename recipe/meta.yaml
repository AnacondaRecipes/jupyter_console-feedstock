{% set version = "6.6.2" %}

package:
  name: jupyter_console
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/j/jupyter_console/jupyter_console-{{ version }}.tar.gz
  sha256: 7385dfed8a01fd51e3c98449dae24f38c1ba015d2073835e785671653a0967fc

build:
  number: 0
  # jupyter_core does not have support for python 3.7
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  entry_points:
    - jupyter-console = jupyter_console.app:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - hatchling 1.8.0
  run:
    - python
    - jupyter_client >=7.0.0
    - ipython
    - ipykernel >=6.14
    - prompt_toolkit >=3.0.30
    - pygments
    - jupyter_core >=4.12,!=5.0.*
    - pyzmq >=17
    - traitlets >=5.4

test:
  imports:
    - jupyter_console
  requires:
    - pip
  commands:
    - pip check
    - jupyter-console -h
    - jupyter kernelspec list

about:
  home: https://jupyter.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Jupyter terminal console
  description: |
    Jupyter console is a terminal frontend for kernels using the Jupyter protocol.
  doc_url: https://jupyter-console.readthedocs.io/
  doc_source_url: https://github.com/jupyter/jupyter_console/blob/master/docs/index.rst
  dev_url: https://github.com/jupyter/jupyter_console

extra:
  recipe-maintainers:
    - SylvainCorlay
    - jakirkham
    - minrk
    - pelson
    - takluyver
    - ocefpaf
    - blink1073
    - Carreau
